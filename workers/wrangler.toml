name = "expobox"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[dev]
port = 8787

[observability]
[observability.logs]
enabled = true
invocation_logs = true

[[containers]]
class_name = "PreviewContainer"
image = "../preview/Dockerfile"
image_build_context = "../"
max_instances = 20
instance_type = "standard-2"

[[durable_objects.bindings]]
name = "PREVIEW_CONTAINER"
class_name = "PreviewContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PreviewContainer"]
